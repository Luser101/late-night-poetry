kind = "web"
previewPath = "/"
title = "Late Night Poetry"
description = "A responsive digital reading experience for a seven-page love poem, preserving the original's soft paper, pink lace, and botanical atmosphere while adding gentle web interactions."
version = "1.0.0"
id = "artifacts/late-night-poetry"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21318

[services.development]
run = "pnpm --filter @workspace/late-night-poetry run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/late-night-poetry", "run", "build" ]
serve = "static"
publicDir = "artifacts/late-night-poetry/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21318"
BASE_PATH = "/"
